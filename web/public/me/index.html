<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPG · AI 网关</title>
<meta name="description" content="CPG AI 网关与用户控制台。">
<meta name="theme-color" content="#ff6b9d">
<link rel="icon" href="/favicon.svg">
<style>
  :root{
    --pink:#ff6b9d; --pink-hover:#ff4585; --pink-light:#ffb3d1; --pink-dark:#e55a8a;
    --violet:#6366f1; --mint:#06d6a0;
    --grad-primary:linear-gradient(135deg,#ff6b9d 0%,#6366f1 100%);
    --grad-cool:linear-gradient(135deg,#a8edea 0%,#fed6e3 100%);

    --text-1:#1f2937; --text-2:#4b5563; --text-3:#8b95a5;
    --bg-1:#ffffff; --bg-2:#fdf7fa;
    --card:rgba(255,255,255,.78);
    --border:#f2e3ea;
    --nav-bg:rgba(255,255,255,.72);
    --shadow:0 8px 32px rgba(255,107,157,.15);
    --shadow-sm:0 2px 10px rgba(255,107,157,.10);
    --radius:22px;

    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',
           'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --mono:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --text-1:#f9fafb; --text-2:#d1d5db; --text-3:#9ca3af;
      --bg-1:#11131a; --bg-2:#171a22;
      --card:rgba(255,255,255,.045);
      --border:#2a2e3b;
      --nav-bg:rgba(17,19,26,.72);
      --shadow:0 8px 32px rgba(0,0,0,.45);
      --shadow-sm:0 2px 10px rgba(0,0,0,.35);
    }
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body{
    margin:0; min-height:100vh; position:relative; overflow-x:hidden;
    font-family:var(--font); font-size:16px; line-height:1.75;
    color:var(--text-1); background:var(--bg-1);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  body::before, body::after{
    content:""; position:fixed; border-radius:50%; filter:blur(80px);
    z-index:-1; pointer-events:none;
  }
  body::before{
    width:46vmax; height:46vmax; top:-16vmax; right:-14vmax;
    background:radial-gradient(circle,#ff6b9d59,transparent 70%);
  }
  body::after{
    width:42vmax; height:42vmax; bottom:-18vmax; left:-14vmax;
    background:radial-gradient(circle,#6366f14d,transparent 70%);
  }

  .wrap{ max-width:880px; margin:0 auto; padding:0 22px; }

  .nav{
    position:sticky; top:0; z-index:10;
    background:var(--nav-bg);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    max-width:880px; margin:0 auto; padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{
    display:flex; align-items:center; gap:9px;
    font-weight:700; font-size:17px; color:var(--text-1);
    text-decoration:none; letter-spacing:.02em;
  }
  .brand-dot{
    width:11px; height:11px; border-radius:50%;
    background:var(--grad-primary); box-shadow:0 0 0 4px rgba(255,107,157,.16);
  }
  .nav-links{ display:flex; align-items:center; gap:22px; }
  .nav-links a{
    color:var(--text-2); text-decoration:none; font-size:14.5px;
    padding:4px 0; position:relative; transition:color .2s ease;
  }
  .nav-links a::after{
    content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px;
    border-radius:2px; background:var(--grad-primary);
    transform:scaleX(0); transform-origin:left; transition:transform .24s ease;
  }
  .nav-links a:hover{ color:var(--pink); }
  .nav-links a:hover::after{ transform:scaleX(1); }

  .hero{ padding:clamp(48px,9vw,92px) 0 clamp(32px,5vw,54px); text-align:center; }
  .avatar{
    width:120px; height:120px; display:block; margin:0 auto 26px;
    border-radius:50%; object-fit:cover; object-position:center;
    background:var(--grad-primary);
    filter:drop-shadow(0 12px 30px rgba(255,107,157,.35));
    animation:bob 5s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }

  .hero h1{
    margin:0 0 12px; font-size:clamp(30px,6vw,46px); line-height:1.25;
    letter-spacing:-.01em; font-weight:800;
  }
  .grad-text{
    background:var(--grad-primary);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  .hero p{
    margin:0 auto; max-width:30em; color:var(--text-2);
    font-size:clamp(15px,2.4vw,17px);
  }

  .cta{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:34px; }
  .btn{
    display:inline-flex; align-items:center; gap:9px;
    padding:12px 26px; border-radius:999px; border:0; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600; text-decoration:none;
    transition:transform .18s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn-primary{
    color:#fff; background:var(--grad-primary);
    box-shadow:0 8px 24px rgba(255,107,157,.34);
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 30px rgba(255,107,157,.44); }
  .btn-ghost{
    color:var(--text-1); background:var(--card);
    border:1px solid var(--border); box-shadow:var(--shadow-sm);
  }
  .btn-ghost:hover{ transform:translateY(-2px); border-color:var(--pink-light); color:var(--pink); }

  .section{ padding:clamp(30px,5vw,48px) 0; }
  .section-title{
    display:flex; align-items:center; gap:11px;
    margin:0 0 24px; font-size:19px; font-weight:700; letter-spacing:.01em;
  }
  .section-title::after{
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg,var(--border),transparent);
  }

  .grid{
    display:grid; gap:18px;
    grid-template-columns:repeat(auto-fit,minmax(238px,1fr));
  }
  .card{
    padding:26px 24px; border-radius:var(--radius);
    background:var(--card); border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow); border-color:var(--pink-light);
  }
  .card .ico{ font-size:26px; line-height:1; display:block; margin-bottom:12px; }
  .card h3{ margin:0 0 8px; font-size:16.5px; font-weight:700; }
  .card p{ margin:0; font-size:14.5px; color:var(--text-2); line-height:1.7; }
  .card a{ color:var(--pink); text-decoration:none; }
  .card a:hover{ text-decoration:underline; }

  .contact{
    display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
    padding:30px 22px; border-radius:var(--radius);
    background:var(--grad-cool);
    border:1px solid var(--border);
  }
  @media (prefers-color-scheme: dark){
    .contact{ background:rgba(255,107,157,.10); }
  }
  .contact a{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 20px; border-radius:999px;
    background:var(--card); border:1px solid var(--border);
    color:var(--text-1); text-decoration:none; font-size:14.5px; font-weight:500;
    transition:transform .18s ease, color .18s ease, border-color .18s ease;
  }
  .contact a:hover{ transform:translateY(-2px); color:var(--pink); border-color:var(--pink-light); }

  footer{
    margin-top:clamp(32px,5vw,56px); padding:30px 0 44px;
    border-top:1px solid var(--border); text-align:center;
    color:var(--text-3); font-size:13.5px;
  }
  footer .code{ font-family:var(--mono); font-size:12.5px; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation:none !important; transition:none !important; }
    html{ scroll-behavior:auto; }
  }
  @media (max-width:520px){
    .nav-links{ gap:16px; }
    .nav-links a{ font-size:13.5px; }
    .avatar{ width:96px; height:96px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="#top"><span class="brand-dot"></span>CPG</a>
    <div class="nav-links">
      <a href="#about">关于</a>
      <a href="#contact">使用帮助</a>
      <a href="/console">站点</a>
    </div>
  </div>
</nav>

<main id="top" class="wrap">

  <header class="hero">
    <img class="avatar" src="/me/avatar.webp" width="120" height="120"
         alt="CPG 标识" decoding="async">

    <h1>欢迎使用 <span class="grad-text">CPG</span></h1>
    <p>统一连接模型服务，管理令牌、用量与余额。</p>

    <div class="cta">
      <a class="btn btn-primary" href="/console">进入站点 →</a>
      <a class="btn btn-ghost" href="#about">了解一下</a>
    </div>
  </header>

  <section id="about" class="section">
    <h2 class="section-title">关于</h2>
    <div class="grid">
      <article class="card">
        <span class="ico">🌱</span>
        <h3>统一接入</h3>
        <p>通过兼容接口连接已配置的模型服务。</p>
      </article>
      <article class="card">
        <span class="ico">🛠️</span>
        <h3>用户控制台</h3>
        <p>查看用量与余额，管理自己的设备令牌。</p>
      </article>
      <article class="card">
        <span class="ico">🍥</span>
        <h3>自主部署</h3>
        <p>由部署方配置服务商、模型与访问权限。</p>
      </article>
    </div>
  </section>

  <section id="contact" class="section">
    <h2 class="section-title">使用帮助</h2>
    <div class="contact">
      <span>💬 请联系部署方管理员</span>
      <a href="/console">🔑 站点</a>
      <a href="#top">↑ 回到顶部</a>
    </div>
  </section>

  <footer>
    <div>CPG · AI 网关与用户控制台</div>
    <div class="code">served by Cloudflare</div>
  </footer>

</main>

</body>
</html>

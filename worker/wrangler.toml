name = "cpg-opensource-local"
account_id = "00000000000000000000000000000000"
workers_dev = false
preview_urls = false
send_metrics = false
main = "src/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/assets/*", "!/favicon.svg", "!/theme-boot.js", "!/me/avatar.webp"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[[d1_databases]]
binding = "DB"
database_name = "cpg-opensource-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
remote = false

[vars]
GATEWAY_BASE_URL = "http://127.0.0.1:8787"
APP_NAME = "Personal AI Gateway"
VIDEO_REFERENCE_IMAGE_ORIGIN = "http://127.0.0.1:8788"

[triggers]
crons = []

[[r2_buckets]]
binding = "VIDEO_REFERENCES"
bucket_name = "cpg-opensource-local-video-references"
remote = false



